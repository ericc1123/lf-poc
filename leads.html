<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Captured Leads</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  margin:0;
  padding:2rem;
  background:#fafafa;
  color:#333;
}
h1{text-align:center;color:#004c97;}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:1rem;
}
th,td{
  border:1px solid #ddd;
  padding:.5rem;
  text-align:left;
}
th{
  background:#004c97;
  color:#fff;
}
td[contenteditable="true"]{
  background:#fff8e1;
}
.actions{
  margin-top:1rem;
  display:flex;
  gap:1rem;
  justify-content:center;
}
button{
  background:#004c97;
  color:#fff;
  border:none;
  padding:.5rem 1rem;
  border-radius:4px;
  cursor:pointer;
  font-size:1rem;
}
button:hover{
  background:#0088cc;
}
</style>
</head>
<body>
<h1>Captured Leads</h1>
<div class="actions">
  <button onclick="exportCSV()">Export CSV</button>
  <button onclick="location.href='index.html'">Add New Lead</button>
</div>
<table id="leadsTable">
  <thead>
    <tr id="headerRow"></tr>
  </thead>
  <tbody></tbody>
</table>

<script>
// Build table from localStorage
const headers = ["First Name","Last Name","Phone","Email","Company","Employee Count","Job Title","Tags","Other Contact","Notes","Timestamp"];
const storageKeyMap = {
  "First Name":"firstName",
  "Last Name":"lastName",
  "Phone":"phone",
  "Email":"email",
  "Company":"company",
  "Employee Count":"employeeCount",
  "Job Title":"jobTitle",
  "Tags":"tags",
  "Other Contact":"otherContact",
  "Notes":"notes",
  "Timestamp":"timestamp"
};
function loadTable(){
  const leads = JSON.parse(localStorage.getItem('leads')||'[]');
  const headerRow = document.getElementById('headerRow');
  headerRow.innerHTML = headers.map(h=>`<th>${h}</th>`).join('');
  const tbody = document.querySelector('#leadsTable tbody');
  tbody.innerHTML='';
  leads.forEach((lead,idx)=>{
    const tr=document.createElement('tr');
    headers.forEach(h=>{
      const key=storageKeyMap[h];
      const td=document.createElement('td');
      let val=lead[key]||'';
      if(Array.isArray(val)) val = val.join('; ');
      td.textContent=val;
      if(h!=="Timestamp"){ // make editable except timestamp
        td.contentEditable="true";
        td.addEventListener('blur',()=>updateLead(idx,key,td.textContent));
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}
function updateLead(index,key,value){
  const leads = JSON.parse(localStorage.getItem('leads')||'[]');
  if(Array.isArray(leads[index][key])){
    leads[index][key]=value.split(';').map(v=>v.trim()).filter(Boolean);
  }else{
    leads[index][key]=value.trim();
  }
  localStorage.setItem('leads',JSON.stringify(leads));
}
function exportCSV(){
  const leads = JSON.parse(localStorage.getItem('leads')||'[]');
  if(!leads.length){
    alert('No leads to export.');
    return;
  }
  const csvHeaders = headers.join(',');
  const rows = leads.map(lead=>{
    return headers.map(h=>{
      let val = lead[storageKeyMap[h]] || '';
      if(Array.isArray(val)) val = val.join('; ');
      return `"\${val.replace(/"/g,'""')}"`;
    }).join(',');
  });
  const csvContent = [csvHeaders,...rows].join('\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'leads_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

loadTable();
</script>
</body>
</html>
